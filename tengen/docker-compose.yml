services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tengen
      POSTGRES_USER: tengen
      POSTGRES_PASSWORD: tengen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tengen -d tengen"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tengen
      DB_USER: tengen
      DB_PASSWORD: tengen
      # Admin API auth — override in production
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-bytes-min}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Browser origin for the SPA (compose serves it on :3000)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      args:
        # Baked at build time; points the proxy route handler at the backend service
        NEXT_PUBLIC_API_URL: http://app:8080
    depends_on:
      - app
    ports:
      - "3000:3000"

volumes:
  pgdata:
