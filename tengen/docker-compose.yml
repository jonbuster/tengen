services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tengen
      POSTGRES_USER: tengen
      POSTGRES_PASSWORD: tengen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tengen -d tengen"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tengen
      DB_USER: tengen
      DB_PASSWORD: tengen
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Admin API auth — override in production
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32-bytes-min}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-dev-webhook-signing-secret-change-me}
      # Browser origin for the SPA (compose serves it on :3000)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      WEBHOOK_WORKER_ENABLED: ${WEBHOOK_WORKER_ENABLED:-true}
      WEBHOOK_WORKER_POLL_INTERVAL_MS: ${WEBHOOK_WORKER_POLL_INTERVAL_MS:-1000}
      WEBHOOK_WORKER_INITIAL_DELAY_MS: ${WEBHOOK_WORKER_INITIAL_DELAY_MS:-1000}
      WEBHOOK_WORKER_BATCH_SIZE: ${WEBHOOK_WORKER_BATCH_SIZE:-25}
      WEBHOOK_WORKER_MAX_ATTEMPTS: ${WEBHOOK_WORKER_MAX_ATTEMPTS:-8}
      WEBHOOK_WORKER_BASE_DELAY_MS: ${WEBHOOK_WORKER_BASE_DELAY_MS:-5000}
      WEBHOOK_WORKER_MAX_DELAY_MS: ${WEBHOOK_WORKER_MAX_DELAY_MS:-900000}
      WEBHOOK_WORKER_LEASE_DURATION_MS: ${WEBHOOK_WORKER_LEASE_DURATION_MS:-300000}
      WEBHOOK_WORKER_CONNECT_TIMEOUT_MS: ${WEBHOOK_WORKER_CONNECT_TIMEOUT_MS:-3000}
      WEBHOOK_WORKER_READ_TIMEOUT_MS: ${WEBHOOK_WORKER_READ_TIMEOUT_MS:-5000}
    ports:
      - "${APP_PORT:-8080}:8080"

  frontend:
    build:
      context: ../frontend
    environment:
      BACKEND_API_URL: http://app:8080
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
