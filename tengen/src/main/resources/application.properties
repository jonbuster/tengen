spring.application.name=tengen

# Include the per-request correlation ID in every HTTP log line without
# creating access logs or carrying the ID into asynchronous delivery records.
logging.pattern.correlation=[requestId=%X{requestId:-none}]

# Datasource driven by environment variables (Docker Compose passes these)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tengen}
spring.datasource.username=${DB_USER:tengen}
spring.datasource.password=${DB_PASSWORD:tengen}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Versioned schema migrations. Existing unversioned installations are baselined
# at V1 after an operator backup; V2 then applies the hardening changes.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Jackson
spring.jackson.time-zone=UTC

# JWT (env overrides; dev fallbacks below)
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-min}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
jwt.issuer=${JWT_ISSUER:tengen}
jwt.audience=${JWT_AUDIENCE:tengen-admin}

# Admin credentials (env overrides)
admin.user=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:admin}

# CORS for the Next.js frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Background webhook delivery worker (outbox rows are persisted before delivery)
tengen.webhook.worker.enabled=${WEBHOOK_WORKER_ENABLED:true}
tengen.webhook.worker.poll-interval-ms=${WEBHOOK_WORKER_POLL_INTERVAL_MS:1000}
tengen.webhook.worker.initial-delay-ms=${WEBHOOK_WORKER_INITIAL_DELAY_MS:1000}
tengen.webhook.worker.batch-size=${WEBHOOK_WORKER_BATCH_SIZE:25}
tengen.webhook.worker.max-attempts=${WEBHOOK_WORKER_MAX_ATTEMPTS:8}
tengen.webhook.worker.base-delay-ms=${WEBHOOK_WORKER_BASE_DELAY_MS:5000}
tengen.webhook.worker.max-delay-ms=${WEBHOOK_WORKER_MAX_DELAY_MS:900000}
tengen.webhook.worker.lease-duration-ms=${WEBHOOK_WORKER_LEASE_DURATION_MS:300000}
tengen.webhook.worker.connect-timeout-ms=${WEBHOOK_WORKER_CONNECT_TIMEOUT_MS:3000}
tengen.webhook.worker.read-timeout-ms=${WEBHOOK_WORKER_READ_TIMEOUT_MS:5000}
tengen.webhook.worker.signing-secret=${WEBHOOK_SIGNING_SECRET:dev-webhook-signing-secret-change-me}

# Background email/SMS notification delivery. Provider credentials are stored
# encrypted with TENGEN_CONNECTOR_MASTER_KEY and are never returned to the UI.
tengen.notification.worker.enabled=${NOTIFICATION_WORKER_ENABLED:true}
tengen.notification.worker.poll-interval-ms=${NOTIFICATION_WORKER_POLL_INTERVAL_MS:1000}
tengen.notification.worker.initial-delay-ms=${NOTIFICATION_WORKER_INITIAL_DELAY_MS:1000}
tengen.notification.worker.batch-size=${NOTIFICATION_WORKER_BATCH_SIZE:25}
tengen.notification.worker.max-attempts=${NOTIFICATION_WORKER_MAX_ATTEMPTS:8}
tengen.notification.worker.base-delay-ms=${NOTIFICATION_WORKER_BASE_DELAY_MS:5000}
tengen.notification.worker.max-delay-ms=${NOTIFICATION_WORKER_MAX_DELAY_MS:900000}
tengen.notification.worker.lease-duration-ms=${NOTIFICATION_WORKER_LEASE_DURATION_MS:300000}

# Background absence evaluation worker
tengen.absence.worker.enabled=${TENGEN_ABSENCE_WORKER_ENABLED:true}
tengen.absence.worker.poll-interval-ms=${TENGEN_ABSENCE_WORKER_POLL_INTERVAL_MS:1000}
tengen.absence.worker.initial-delay-ms=${TENGEN_ABSENCE_WORKER_INITIAL_DELAY_MS:1000}
tengen.absence.worker.batch-size=${TENGEN_ABSENCE_WORKER_BATCH_SIZE:100}

# Historical replay/backfill worker. Replay jobs are analysis-only and never send webhooks.
tengen.replay.max-range-days=${TENGEN_REPLAY_MAX_RANGE_DAYS:31}
tengen.replay.max-materialized-output-events=${TENGEN_REPLAY_MAX_MATERIALIZED_OUTPUT_EVENTS:10000}
tengen.replay.worker.enabled=${TENGEN_REPLAY_WORKER_ENABLED:true}
tengen.replay.worker.poll-interval-ms=${TENGEN_REPLAY_WORKER_POLL_INTERVAL_MS:1000}
tengen.replay.worker.initial-delay-ms=${TENGEN_REPLAY_WORKER_INITIAL_DELAY_MS:1000}
tengen.replay.worker.batch-size=${TENGEN_REPLAY_WORKER_BATCH_SIZE:100}
tengen.replay.worker.lease-duration-ms=${TENGEN_REPLAY_WORKER_LEASE_DURATION_MS:300000}

# Rule and ingestion safety limits
tengen.rules.max-expression-length=${RULE_MAX_EXPRESSION_LENGTH:10000}
tengen.ingestion.max-body-bytes=${INGESTION_MAX_BODY_BYTES:1048576}
tengen.ingestion.rate-limit-per-minute=${INGESTION_RATE_LIMIT_PER_MINUTE:600}
tengen.ingestion.max-future-skew-seconds=${INGESTION_MAX_FUTURE_SKEW_SECONDS:300}
tengen.ingestion.allowed-lateness-seconds=${INGESTION_ALLOWED_LATENESS_SECONDS:300}

# Optional UI-managed RabbitMQ connector. The master key is a base64 encoded
# random 32-byte AES key; it is intentionally empty by default so HTTP/admin
# operation remains available when no connector is configured.
tengen.connector.master-key=${TENGEN_CONNECTOR_MASTER_KEY:}
tengen.rabbitmq.allowed-hosts=${TENGEN_RABBITMQ_ALLOWED_HOSTS:}
tengen.rabbitmq.connection-timeout-ms=${TENGEN_RABBITMQ_CONNECTION_TIMEOUT_MS:5000}
tengen.rabbitmq.handshake-timeout-ms=${TENGEN_RABBITMQ_HANDSHAKE_TIMEOUT_MS:5000}
tengen.rabbitmq.shutdown-timeout-ms=${TENGEN_RABBITMQ_SHUTDOWN_TIMEOUT_MS:5000}
tengen.rabbitmq.dead-letter-timeout-ms=${TENGEN_RABBITMQ_DEAD_LETTER_TIMEOUT_MS:5000}
# Listener concurrency is intentionally conservative by default. Increase only after load testing.
tengen.rabbitmq.consumers=${TENGEN_RABBITMQ_CONSUMERS:1}
tengen.rabbitmq.prefetch=${TENGEN_RABBITMQ_PREFETCH:1}
tengen.auth.login-max-attempts=${LOGIN_MAX_ATTEMPTS:5}
tengen.auth.login-window-seconds=${LOGIN_WINDOW_SECONDS:60}
tengen.auth.refresh-replay-grace-seconds=${REFRESH_REPLAY_GRACE_SECONDS:2}

# Retention (terminal operational data only; rule revision history is permanent)
tengen.retention.enabled=${RETENTION_ENABLED:true}
tengen.retention.days=${RETENTION_DAYS:90}
tengen.retention.batch-size=${RETENTION_BATCH_SIZE:1000}
tengen.retention.schedule=${RETENTION_SCHEDULE:0 15 3 * * *}

# Health and metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,prometheus
