spring.application.name=tengen

# Datasource driven by environment variables (Docker Compose passes these)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tengen}
spring.datasource.username=${DB_USER:tengen}
spring.datasource.password=${DB_PASSWORD:tengen}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Versioned schema migrations. Existing unversioned installations are baselined
# at V1 after an operator backup; V2 then applies the hardening changes.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Jackson
spring.jackson.time-zone=UTC

# JWT (env overrides; dev fallbacks below)
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-min}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
jwt.issuer=${JWT_ISSUER:tengen}
jwt.audience=${JWT_AUDIENCE:tengen-admin}

# Admin credentials (env overrides)
admin.user=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:admin}

# CORS for the Next.js frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Background webhook delivery worker (outbox rows are persisted before delivery)
tengen.webhook.worker.enabled=${WEBHOOK_WORKER_ENABLED:true}
tengen.webhook.worker.poll-interval-ms=${WEBHOOK_WORKER_POLL_INTERVAL_MS:1000}
tengen.webhook.worker.initial-delay-ms=${WEBHOOK_WORKER_INITIAL_DELAY_MS:1000}
tengen.webhook.worker.batch-size=${WEBHOOK_WORKER_BATCH_SIZE:25}
tengen.webhook.worker.max-attempts=${WEBHOOK_WORKER_MAX_ATTEMPTS:8}
tengen.webhook.worker.base-delay-ms=${WEBHOOK_WORKER_BASE_DELAY_MS:5000}
tengen.webhook.worker.max-delay-ms=${WEBHOOK_WORKER_MAX_DELAY_MS:900000}
tengen.webhook.worker.lease-duration-ms=${WEBHOOK_WORKER_LEASE_DURATION_MS:300000}
tengen.webhook.worker.connect-timeout-ms=${WEBHOOK_WORKER_CONNECT_TIMEOUT_MS:3000}
tengen.webhook.worker.read-timeout-ms=${WEBHOOK_WORKER_READ_TIMEOUT_MS:5000}
tengen.webhook.worker.signing-secret=${WEBHOOK_SIGNING_SECRET:dev-webhook-signing-secret-change-me}

# Rule and ingestion safety limits
tengen.rules.max-expression-length=${RULE_MAX_EXPRESSION_LENGTH:10000}
tengen.ingestion.max-body-bytes=${INGESTION_MAX_BODY_BYTES:1048576}
tengen.ingestion.rate-limit-per-minute=${INGESTION_RATE_LIMIT_PER_MINUTE:600}
tengen.ingestion.max-future-skew-seconds=${INGESTION_MAX_FUTURE_SKEW_SECONDS:300}
tengen.ingestion.allowed-lateness-seconds=${INGESTION_ALLOWED_LATENESS_SECONDS:300}
tengen.auth.login-max-attempts=${LOGIN_MAX_ATTEMPTS:5}
tengen.auth.login-window-seconds=${LOGIN_WINDOW_SECONDS:60}
tengen.auth.refresh-replay-grace-seconds=${REFRESH_REPLAY_GRACE_SECONDS:2}

# Retention (terminal operational data only; rule revision history is permanent)
tengen.retention.enabled=${RETENTION_ENABLED:true}
tengen.retention.days=${RETENTION_DAYS:90}
tengen.retention.batch-size=${RETENTION_BATCH_SIZE:1000}
tengen.retention.schedule=${RETENTION_SCHEDULE:0 15 3 * * *}

# Health and metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,prometheus
