spring.application.name=tengen

# Datasource driven by environment variables (Docker Compose passes these)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tengen}
spring.datasource.username=${DB_USER:tengen}
spring.datasource.password=${DB_PASSWORD:tengen}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson
spring.jackson.time-zone=UTC

# JWT (env overrides; dev fallbacks below)
jwt.secret=${JWT_SECRET:dev-secret-change-me-please-32-bytes-min}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

# Admin credentials (env overrides)
admin.user=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:admin}

# CORS for the Next.js frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Background webhook delivery worker (outbox rows are persisted before delivery)
tengen.webhook.worker.enabled=${WEBHOOK_WORKER_ENABLED:true}
tengen.webhook.worker.poll-interval-ms=${WEBHOOK_WORKER_POLL_INTERVAL_MS:1000}
tengen.webhook.worker.initial-delay-ms=${WEBHOOK_WORKER_INITIAL_DELAY_MS:1000}
tengen.webhook.worker.batch-size=${WEBHOOK_WORKER_BATCH_SIZE:25}
tengen.webhook.worker.max-attempts=${WEBHOOK_WORKER_MAX_ATTEMPTS:8}
tengen.webhook.worker.base-delay-ms=${WEBHOOK_WORKER_BASE_DELAY_MS:5000}
tengen.webhook.worker.max-delay-ms=${WEBHOOK_WORKER_MAX_DELAY_MS:900000}
tengen.webhook.worker.lease-duration-ms=${WEBHOOK_WORKER_LEASE_DURATION_MS:300000}
tengen.webhook.worker.connect-timeout-ms=${WEBHOOK_WORKER_CONNECT_TIMEOUT_MS:3000}
tengen.webhook.worker.read-timeout-ms=${WEBHOOK_WORKER_READ_TIMEOUT_MS:5000}
